name: AI Documentation Agent

on:
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write

jobs:
  ai_review:
    runs-on: ubuntu-latest
    if: ${{ !github.event.pull_request.draft }}
    steps:
      - name: Code Review by AI Agent
        uses: coderabbitai/ai-pr-reviewer@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        with:
          debug: false
          review_simple_changes: false
          review_comment_lgtm: false
          system_message: |
            You are an AI Documentation and Architecture Agent.
            Your role is to:
            1. Review repository changes for architectural modifications.
            2. Suggest documentation updates automatically.
            3. Generate missing documentation strings and architecture summaries.
            4. Keep all PR summaries focused on how changes affect the overall system graph.
