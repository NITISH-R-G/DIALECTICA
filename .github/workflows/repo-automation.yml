name: Repository Automation

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  release:
    types: [published]
  schedule:
    - cron: '0 0 * * 0' # Weekly on Sunday

jobs:
  analyze_and_document:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install analysis dependencies
      run: |
        python -m pip install --upgrade pip

    - name: Run Repository Analyzer
      run: python .github/scripts/repo_analyzer.py

    - name: Run Diagram Generator
      run: python .github/scripts/diagram_generator.py

    - name: Run README Updater
      run: python .github/scripts/readme_updater.py

    - name: Commit and push if changed
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add README.md architecture.json diagrams/
        git diff --quiet && git diff --staged --quiet || (git commit -m "docs: Auto-update architecture and README" && git push)
